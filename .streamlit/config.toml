# CrowdSense AI — application theme (light operator console).
# White page, soft panels, dark teal accent, quiet borders.

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFBFC"
textColor = "#1B2430"
font = "sans"
baseRadius = "10"
buttonRadius = "8"
borderColor = "#E4E9EF"
dataframeBorderColor = "#E4E9EF"
dataframeHeaderBackgroundColor = "#F6F8FA"
codeBackgroundColor = "#F1F5F9"
showSidebarBorder = true
chartCategoricalColors = ["#0F766E", "#60A5FA", "#FBBF24", "#DC2626", "#A78BFA", "#16A34A"]

[theme.sidebar]
backgroundColor = "#F6F8FA"
