# CrowdSense AI — application theme (dark analytics shell).
# Deep navy-charcoal surfaces, restrained teal accent, subtle borders.

[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2B"
textColor = "#E6EDF3"
font = "sans"
baseRadius = "10"
buttonRadius = "8"
borderColor = "#1F2A3E"
dataframeBorderColor = "#1F2A3E"
dataframeHeaderBackgroundColor = "#162136"
codeBackgroundColor = "#0E1626"
showSidebarBorder = true
chartCategoricalColors = ["#2DD4BF", "#60A5FA", "#FBBF24", "#F87171", "#A78BFA", "#34D399"]

[theme.sidebar]
backgroundColor = "#0D1422"
